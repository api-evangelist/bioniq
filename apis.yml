name: Bioniq
description: 'Bioniq is a personalized nutrition and supplement company founded in London
  in 2019 that combines individual biomarker and blood-test data with a proprietary algorithm
  to formulate customized vitamin and mineral blends delivered as Swiss-made granules. Its
  consumer product line spans Bioniq GO (wellness-assessment based), Bioniq PRO (blood-test
  driven), and Bioniq Essential, supported by iOS and Android apps for tracking health and
  supplement routines. Bioniq is a portfolio company of HV Capital and now operates within
  Herbalife. It exposes consumer web, mobile, and partner/affiliate surfaces but publishes
  no public developer API, SDK, or API documentation as of this enrichment pass.'
